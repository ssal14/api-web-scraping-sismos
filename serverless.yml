org: TU_ORG_SERVERLESS   # <-- reemplazar con tu org (igual que en el Paso 1 de la diapositiva)
service: api-web-scraping-sismos

provider:
  name: aws
  runtime: python3.12
  memorySize: 1024
  timeout: 30
  iam:
    role: arn:aws:iam::TU_ACCOUNT_ID:role/LabRole   # <-- reemplazar con el role de tu Learner Lab

functions:
  scrape_sismos:
    handler: scrap_sismos.lambda_handler  # el nombre del archivo y la función deben coincidir
    package:
      include:
        - ./**  # incluir todo el contenido del directorio (librerías instaladas con pip3 -t .)
    events:
      - http:
          path: /scrape/sismos
          method: get
          cors: true
          integration: lambda

resources:
  Resources:
    TablaSismosIGP:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: TablaSismosIGP
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
